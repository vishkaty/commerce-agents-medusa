[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-agents-medusa"
version = "0.2.0"
description = "Claude Commerce Agents over Medusa v2: StorefrontBackend and MerchantBackend adapters, durable ledger and sessions, Stripe Checkout placement, and a host for the reference web apps."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Vishal Katyal", email = "vishal@katyal.ai" }]
keywords = ["claude", "commerce", "agents", "medusa", "stripe"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "fastapi>=0.132",
  "uvicorn>=0.30",
  "claude-agent-sdk>=0.2.139",
  # The reference implementation's packages are not on PyPI; they install from its
  # repository at the commit this release was verified against.
  "commerce-common[examples,sdk] @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=commerce-common",
  "shopping-agent-core @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=shopping-agent/core",
  "merchant-agent-core @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=merchant-agent/core",
  "shopping-agent-runtime @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=shopping-agent/runtime-messages-api",
  "merchant-agent-runtime @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=merchant-agent/runtime-messages-api",
  "shopping-agent-sdk @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=shopping-agent/runtime-agent-sdk",
  "merchant-agent-sdk @ git+https://github.com/anthropics/commerce-agents.git@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf#subdirectory=merchant-agent/runtime-agent-sdk",
]

[project.optional-dependencies]
analysis = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "psycopg[binary]>=3.2",
  "commerce-agents-conformance @ git+https://github.com/vishkaty/commerce-agents-conformance.git",
]

[project.urls]
Homepage = "https://github.com/vishkaty/commerce-agents-medusa"
Issues = "https://github.com/vishkaty/commerce-agents-medusa/issues"
Conformance = "https://github.com/vishkaty/commerce-agents-conformance"
"Reference implementation" = "https://github.com/anthropics/commerce-agents"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_medusa", "src/demo_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["medusa: needs a running Medusa store"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/demo_common"]  # vendored unchanged from the reference

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
